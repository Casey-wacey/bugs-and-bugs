name: Update Episode Count

on:
  schedule:
    - cron: "0 12 * * *"  # runs every day at noon UTC
  workflow_dispatch:        # lets you also trigger it manually from GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run scraper
        run: python scripts/update_episodes.py

      - name: Commit updated episodes.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes.json
          git diff --cached --quiet || git commit -m "Update episode count"
          git push
